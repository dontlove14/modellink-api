identity:
  name: "seedream_text2image"
  author: "modellink"
  label:
    en_US: "Seedream Text-to-Image"
    zh_Hans: "Seedream 文生图"
    pt_BR: "Seedream Texto para Imagem"
    ja_JP: "Seedream テキストから画像"
description:
  human:
    en_US: "Generate images with Seedream (text-to-image)."
    zh_Hans: "使用 Seedream 进行文生图生成。"
    pt_BR: "Gerar imagens com Seedream (texto para imagem)."
    ja_JP: "Seedream でテキストから画像を生成します。"
  llm: "Seedream text-to-image generation."
parameters:
  - name: api_key
    type: secret-input
    required: true
    label:
      en_US: API Key
      zh_Hans: API 密钥
      pt_BR: Chave da API
      ja_JP: API キー
    human_description:
      en_US: "API key for authentication."
      zh_Hans: "用于认证的 API 密钥。"
      pt_BR: "Chave de API para autenticação."
      ja_JP: "認証用の API キー。"
    llm_description: "API key for authentication."
    placeholder:
      en_US: "Your API key"
      zh_Hans: "请输入您的 API 密钥"
      pt_BR: "Insira sua chave de API"
      ja_JP: "API キーを入力してください"
    help:
      en_US: "API key for authentication."
      zh_Hans: "用于认证的 API 密钥。"
      pt_BR: "Chave de API para autenticação."
      ja_JP: "認証用の API キー。"
    form: llm
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 提示词
      pt_BR: Prompt
      ja_JP: プロンプト
    human_description:
      en_US: "Text prompt for image generation. Aspect ratio and resolution will be appended into the prompt if selected."
      zh_Hans: "用于生成图片的文本提示词。若选择宽高比/分辨率，会在工具内部拼接到提示词中。"
      pt_BR: "Prompt de texto para geração de imagem. A proporção e resolução serão anexadas ao prompt se selecionadas."
      ja_JP: "画像生成用のテキストプロンプト。比率/解像度を選択した場合、プロンプトに追加されます。"
    llm_description: "Text prompt for image generation."
    placeholder:
      en_US: "A cute baby sea otter, detailed, 16:9, 2K"
      zh_Hans: "一只可爱的小海獭，细节丰富 16:9 2K"
      pt_BR: "Uma lontra-marinha bebê fofa, detalhada, 16:9, 2K"
      ja_JP: "かわいい赤ちゃんラッコ、詳細、16:9、2K"
    help:
      en_US: "Text prompt for image generation."
      zh_Hans: "用于生成图片的文本提示词。"
      pt_BR: "Prompt de texto para geração de imagem."
      ja_JP: "画像生成用のテキストプロンプト。"
    form: llm
  - name: n
    type: number
    required: false
    label:
      en_US: Number of Images
      zh_Hans: 生成数量
      pt_BR: Número de Imagens
      ja_JP: 生成枚数
    human_description:
      en_US: "How many images to generate."
      zh_Hans: "生成图片的数量（n）。"
      pt_BR: "Quantas imagens gerar."
      ja_JP: "生成する画像の枚数（n）。"
    llm_description: "Number of images to generate."
    placeholder:
      en_US: "1"
      zh_Hans: "1"
      pt_BR: "1"
      ja_JP: "1"
    help:
      en_US: "Number of images to generate."
      zh_Hans: "生成图片的数量（n）。"
      pt_BR: "Número de imagens a gerar."
      ja_JP: "生成する画像の枚数（n）。"
    form: llm
  - name: watermark
    type: boolean
    required: false
    label:
      en_US: Watermark
      zh_Hans: 水印
      pt_BR: Marca d'água
      ja_JP: 透かし
    human_description:
      en_US: "Whether the generated image contains a watermark."
      zh_Hans: "生成图片是否包含水印。"
      pt_BR: "Se a imagem gerada contém marca d'água."
      ja_JP: "生成画像に透かしを含めるかどうか。"
    llm_description: "Whether the generated image contains a watermark."
    placeholder:
      en_US: "false"
      zh_Hans: "false"
      pt_BR: "false"
      ja_JP: "false"
    help:
      en_US: "true: with watermark, false: without watermark."
      zh_Hans: "true：带水印，false：不带水印。"
      pt_BR: "true: com marca d'água, false: sem marca d'água."
      ja_JP: "true: 透かしあり、false: 透かしなし。"
    form: llm
  - name: aspect_ratio
    type: select
    required: false
    label:
      en_US: Aspect Ratio
      zh_Hans: 宽高比
      pt_BR: Proporção
      ja_JP: アスペクト比
    human_description:
      en_US: "Aspect ratio used to calculate the size parameter."
      zh_Hans: "用于换算 size 参数的宽高比。"
      pt_BR: "Proporção usada para calcular o parâmetro size."
      ja_JP: "size パラメータ算出に使うアスペクト比。"
    llm_description: "Aspect ratio used to calculate size."
    options:
      - value: "1:1"
        label: { en_US: "1:1", zh_Hans: "1:1", pt_BR: "1:1", ja_JP: "1:1" }
      - value: "3:4"
        label: { en_US: "3:4", zh_Hans: "3:4", pt_BR: "3:4", ja_JP: "3:4" }
      - value: "4:3"
        label: { en_US: "4:3", zh_Hans: "4:3", pt_BR: "4:3", ja_JP: "4:3" }
      - value: "16:9"
        label: { en_US: "16:9", zh_Hans: "16:9", pt_BR: "16:9", ja_JP: "16:9" }
      - value: "9:16"
        label: { en_US: "9:16", zh_Hans: "9:16", pt_BR: "9:16", ja_JP: "9:16" }
      - value: "21:9"
        label: { en_US: "21:9", zh_Hans: "21:9", pt_BR: "21:9", ja_JP: "21:9" }
    form: llm
extra:
  python:
    source: tools/seedream_text2image.py
