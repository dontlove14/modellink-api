identity:
  name: "sora_character_create_by_url"
  author: "modellink"
  label:
    en_US: "Sora Character Create (URL)"
    zh_Hans: "Sora 角色创建（视频 URL）"
    pt_BR: "Criar Personagem Sora (URL)"
    ja_JP: "Sora キャラクター作成（URL）"
description:
  human:
    en_US: "Create a Sora character from a video URL and timestamps"
    zh_Hans: "基于视频 URL 与指定片段创建 Sora 角色（可创建真人角色）"
    pt_BR: "Criar um personagem Sora a partir de uma URL de vídeo e intervalo"
    ja_JP: "動画URLと指定区間から Sora キャラクターを作成します"
  llm: "Sora Character Create API (URL)"
parameters:
  - name: apiKey
    type: secret-input
    required: true
    label:
      en_US: API Key
      zh_Hans: API 密钥
      pt_BR: Chave da API
      ja_JP: API キー
    human_description:
      en_US: "API key for authentication"
      zh_Hans: "用于认证的 API 密钥"
      pt_BR: "Chave de API para autenticação"
      ja_JP: "認証用のAPIキー"
    llm_description: "API key for authentication"
    placeholder:
      en_US: "sk-..."
      zh_Hans: "sk-..."
      pt_BR: "sk-..."
      ja_JP: "sk-..."
    help:
      en_US: "API key for authentication"
      zh_Hans: "用于认证的 API 密钥"
      pt_BR: "Chave de API para autenticação"
      ja_JP: "認証用のAPIキー"
    form: llm
  - name: url
    type: string
    required: true
    label:
      en_US: Video URL
      zh_Hans: 视频 URL
      pt_BR: URL do Vídeo
      ja_JP: 動画URL
    human_description:
      en_US: "Video URL used to create the character"
      zh_Hans: "用于创建角色的视频链接（接口字段 url）"
      pt_BR: "URL do vídeo usada para criar o personagem"
      ja_JP: "キャラクター作成に使用する動画URL"
    llm_description: "Video URL used to create the character"
    placeholder:
      en_US: "https://example.com/video.mp4"
      zh_Hans: "https://example.com/video.mp4"
      pt_BR: "https://example.com/video.mp4"
      ja_JP: "https://example.com/video.mp4"
    help:
      en_US: "Publicly accessible video URL"
      zh_Hans: "可公开访问的视频 URL"
      pt_BR: "URL do vídeo acessível publicamente"
      ja_JP: "外部からアクセス可能な動画URL"
    form: llm
  - name: timestamps
    type: string
    required: true
    label:
      en_US: Timestamps
      zh_Hans: 时间范围
      pt_BR: Intervalo de Tempo
      ja_JP: タイムスタンプ範囲
    human_description:
      en_US: "Time range in seconds, format 'start,end', must be within 3 seconds"
      zh_Hans: "时间范围（秒），格式 'start,end'，跨度不大于 3 秒"
      pt_BR: "Intervalo em segundos, formato 'início,fim', deve ser dentro de 3 segundos"
      ja_JP: "秒単位の範囲（形式 'start,end'）、差は 3 秒以内"
    llm_description: "Time range in seconds, format 'start,end'"
    placeholder:
      en_US: "1,3"
      zh_Hans: "1,3"
      pt_BR: "1,3"
      ja_JP: "1,3"
    help:
      en_US: "Example: 1,3"
      zh_Hans: "示例：1,3（相隔时间不能大于 3 秒）"
      pt_BR: "Exemplo: 1,3"
      ja_JP: "例: 1,3"
    form: llm
extra:
  python:
    source: tools/sora_character_create_by_url.py

